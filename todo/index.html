<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Todo</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="app">
    <h1>Todo</h1>

    <form id="new-task" class="new-task" autocomplete="off">
      <div class="new-task-row">
        <label for="task-title" class="visually-hidden">New task</label>
        <input id="task-title" name="title" type="text" placeholder="What needs doing?" required maxlength="200">
        <button type="submit">Add</button>
      </div>
      <div class="new-task-row new-task-extras">
        <label class="field">
          <span>Due</span>
          <input id="task-due" name="due" type="date">
        </label>
        <label class="field field-grow">
          <span>Tags</span>
          <input id="task-tags" name="tags" type="text" placeholder="work, urgent" maxlength="200">
        </label>
      </div>
    </form>

    <nav class="filters" aria-label="Filter by status">
      <button type="button" class="filter" data-status="all">All <span class="count"></span></button>
      <button type="button" class="filter" data-status="active">Active <span class="count"></span></button>
      <button type="button" class="filter" data-status="hold">On hold <span class="count"></span></button>
      <button type="button" class="filter" data-status="done">Completed <span class="count"></span></button>
    </nav>

    <div id="tag-filter" class="tag-filter" aria-label="Filter by tag" hidden></div>

    <ul id="task-list" class="task-list" aria-live="polite"></ul>
    <p id="empty" class="empty" hidden></p>
    <p id="summary" class="summary"></p>
  </main>

  <template id="task-template">
    <li class="task">
      <label class="task-main">
        <input type="checkbox" class="task-done">
        <span class="task-body">
          <span class="task-title"></span>
          <span class="task-meta">
            <span class="task-due"></span>
            <span class="task-tags"></span>
          </span>
        </span>
      </label>
      <button type="button" class="task-hold" aria-pressed="false" title="Put on hold">⏸</button>
      <button type="button" class="task-delete" aria-label="Delete task">✕</button>
    </li>
  </template>

  <script src="app.js"></script>
</body>
</html>
