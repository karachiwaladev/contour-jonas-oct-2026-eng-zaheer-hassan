<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Todo</title>
  <link rel="stylesheet" href="styles/base.css">
  <link rel="stylesheet" href="styles/components.css">
</head>
<body>
  <main class="app">
    <h1>Todo</h1>

    <form id="new-task" class="new-task" autocomplete="off">
      <div class="new-task-row">
        <label for="task-title" class="visually-hidden">New task</label>
        <input id="task-title" name="title" type="text" placeholder="What needs doing?" required maxlength="200">
        <button type="submit">Add</button>
      </div>
      <div class="new-task-row new-task-extras">
        <label class="field">
          <span>Due</span>
          <input id="task-due" name="due" type="date">
        </label>
        <label class="field">
          <span>Priority</span>
          <select id="task-priority" name="priority">
            <option value="high">High</option>
            <option value="medium" selected>Medium</option>
            <option value="low">Low</option>
          </select>
        </label>
        <label class="field">
          <span>Repeat</span>
          <select id="task-repeat" name="repeat">
            <option value="none">None</option>
            <option value="daily">Daily</option>
            <option value="weekly">Weekly</option>
            <option value="monthly">Monthly</option>
          </select>
        </label>
        <label class="field field-grow">
          <span>Tags</span>
          <input id="task-tags" name="tags" type="text" placeholder="work, urgent" maxlength="200">
        </label>
      </div>
    </form>

    <div class="search" role="search">
      <label for="search" class="visually-hidden">Search tasks by title or tag</label>
      <input id="search" type="search" placeholder="Search title or tag" maxlength="200" autocomplete="off">
      <button type="button" id="search-clear" class="search-clear" aria-label="Clear search" title="Clear search" hidden>×</button>
    </div>

    <nav class="filters" aria-label="Filter by status">
      <button type="button" class="filter" data-status="all">All <span class="count"></span></button>
      <button type="button" class="filter" data-status="active">Active <span class="count"></span></button>
      <button type="button" class="filter" data-status="hold">On hold <span class="count"></span></button>
      <button type="button" class="filter" data-status="done">Completed <span class="count"></span></button>
    </nav>

    <nav class="filters" aria-label="Filter by priority">
      <button type="button" class="priority-filter" data-priority="all">Any priority <span class="count"></span></button>
      <button type="button" class="priority-filter" data-priority="high">High <span class="count"></span></button>
      <button type="button" class="priority-filter" data-priority="medium">Medium <span class="count"></span></button>
      <button type="button" class="priority-filter" data-priority="low">Low <span class="count"></span></button>
    </nav>

    <div id="tag-filter" class="tag-filter" aria-label="Filter by tag" hidden></div>

    <ul id="task-list" class="task-list" aria-live="polite"></ul>
    <p id="empty" class="empty" hidden></p>
    <footer id="summary" class="summary"></footer>
  </main>

  <template id="task-template">
    <li class="task">
      <label class="task-main">
        <input type="checkbox" class="task-done">
        <span class="task-body">
          <span class="task-title"></span>
          <span class="task-meta">
            <span class="task-priority"></span>
            <span class="task-repeat-label"></span>
            <span class="task-due"></span>
            <span class="task-tags"></span>
          </span>
        </span>
      </label>
      <button type="button" class="task-repeat" title="Stop repeating (can't be undone)" aria-label="Stop repeating (can't be undone)">⟳</button>
      <button type="button" class="task-edit" aria-label="Edit task" title="Edit">✎</button>
      <button type="button" class="task-hold" aria-pressed="false" title="Put on hold">⏸</button>
      <button type="button" class="task-delete" aria-label="Delete task">✕</button>
    </li>
  </template>

  <template id="edit-template">
    <form class="edit-form" autocomplete="off">
      <label class="field field-grow">
        <span>Title</span>
        <input name="title" type="text" required maxlength="200">
      </label>
      <label class="field">
        <span>Priority</span>
        <select name="priority">
          <option value="high">High</option>
          <option value="medium">Medium</option>
          <option value="low">Low</option>
        </select>
      </label>
      <label class="field">
        <span>Due</span>
        <input name="due" type="date">
      </label>
      <label class="field field-grow">
        <span>Tags</span>
        <input name="tags" type="text" placeholder="work, urgent" maxlength="200">
      </label>
      <div class="edit-actions">
        <button type="submit" class="edit-save">Save</button>
        <button type="button" class="edit-cancel">Cancel</button>
      </div>
    </form>
  </template>

  <script type="module" src="src/main.js"></script>
</body>
</html>
